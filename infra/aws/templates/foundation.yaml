AWSTemplateFormatVersion: '2010-09-09'
Description: Shared deployment resources for Online Code Test

Parameters:
  AppName:
    Type: String
  Stage:
    Type: String
  ArtifactBucketName:
    Type: String
  ApiRepositoryName:
    Type: String
  WorkerRepositoryName:
    Type: String

Resources:
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref ArtifactBucketName
      VersioningConfiguration:
        Status: Enabled

  ApiRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref ApiRepositoryName
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep the 20 most recent images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 20
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }

  WorkerRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref WorkerRepositoryName
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep the 20 most recent images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 20
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }

Outputs:
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
  ApiRepositoryUri:
    Value: !GetAtt ApiRepository.RepositoryUri
  WorkerRepositoryUri:
    Value: !GetAtt WorkerRepository.RepositoryUri
