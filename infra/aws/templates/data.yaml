AWSTemplateFormatVersion: '2010-09-09'
Description: RDS PostgreSQL and ElastiCache Redis for Online Code Test

Parameters:
  AppName:
    Type: String
  Stage:
    Type: String
  VpcId:
    Type: AWS::EC2::VPC::Id
  VpcCidr:
    Type: String
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  DbName:
    Type: String
    Default: online_code_test
  DbUsername:
    Type: String
    Default: oct_admin
  DbPassword:
    Type: String
    NoEcho: true
  DbInstanceClass:
    Type: String
    Default: db.t4g.micro
  DbAllocatedStorage:
    Type: Number
    Default: 20
  RedisNodeType:
    Type: String
    Default: cache.t4g.micro
  RedisTransitEncryptionEnabled:
    Type: String
    AllowedValues:
      - "true"
      - "false"
    Default: "true"

Conditions:
  UseRedisTls: !Equals [!Ref RedisTransitEncryptionEnabled, "true"]

Resources:
  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Access to PostgreSQL from the VPC
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: !Ref VpcCidr
      Tags:
        - Key: Name
          Value: !Sub "${AppName}-${Stage}-db-sg"

  RedisSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Access to Redis from the VPC
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          CidrIp: !Ref VpcCidr
      Tags:
        - Key: Name
          Value: !Sub "${AppName}-${Stage}-redis-sg"

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub "${AppName}-${Stage} database subnet group"
      SubnetIds: !Ref SubnetIds
      Tags:
        - Key: Name
          Value: !Sub "${AppName}-${Stage}-db-subnets"

  CacheSubnetGroup:
    Type: AWS::ElastiCache::SubnetGroup
    Properties:
      Description: !Sub "${AppName}-${Stage} cache subnet group"
      SubnetIds: !Ref SubnetIds

  Database:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub "${AppName}-${Stage}-postgres"
      Engine: postgres
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: !Ref DbAllocatedStorage
      StorageType: gp3
      DBName: !Ref DbName
      MasterUsername: !Ref DbUsername
      MasterUserPassword: !Ref DbPassword
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 1
      DeletionProtection: false
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups:
        - !GetAtt DbSecurityGroup.GroupId
      Tags:
        - Key: Name
          Value: !Sub "${AppName}-${Stage}-postgres"

  RedisReplicationGroup:
    Type: AWS::ElastiCache::ReplicationGroup
    Properties:
      ReplicationGroupId: !Sub "${AppName}-${Stage}-redis"
      ReplicationGroupDescription: !Sub "${AppName}-${Stage} redis"
      Engine: redis
      EngineVersion: "7.1"
      CacheNodeType: !Ref RedisNodeType
      NumNodeGroups: 1
      ReplicasPerNodeGroup: 0
      AutomaticFailoverEnabled: false
      CacheSubnetGroupName: !Ref CacheSubnetGroup
      SecurityGroupIds:
        - !GetAtt RedisSecurityGroup.GroupId
      AtRestEncryptionEnabled: true
      TransitEncryptionEnabled: !If [UseRedisTls, true, false]

  DatabaseHighCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AppName}-${Stage}-postgres-high-cpu"
      AlarmDescription: PostgreSQL CPU has remained above 80 percent.
      Namespace: AWS/RDS
      MetricName: CPUUtilization
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref Database
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  DatabaseLowStorageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AppName}-${Stage}-postgres-low-storage"
      AlarmDescription: PostgreSQL free storage has fallen below 2 GiB.
      Namespace: AWS/RDS
      MetricName: FreeStorageSpace
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref Database
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 2147483648
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching

  RedisHighCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AppName}-${Stage}-redis-high-cpu"
      AlarmDescription: Redis engine CPU has remained above 80 percent.
      Namespace: AWS/ElastiCache
      MetricName: EngineCPUUtilization
      Dimensions:
        - Name: CacheClusterId
          Value: !Sub "${RedisReplicationGroup}-001"
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  RedisEvictionsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AppName}-${Stage}-redis-evictions"
      AlarmDescription: Redis evicted one or more keys during the evaluation period.
      Namespace: AWS/ElastiCache
      MetricName: Evictions
      Dimensions:
        - Name: CacheClusterId
          Value: !Sub "${RedisReplicationGroup}-001"
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  DatabaseHost:
    Value: !GetAtt Database.Endpoint.Address
  DatabasePort:
    Value: !GetAtt Database.Endpoint.Port
  DatabaseName:
    Value: !Ref DbName
  DatabaseUsername:
    Value: !Ref DbUsername
  RedisHost:
    Value: !GetAtt RedisReplicationGroup.PrimaryEndPoint.Address
  RedisPort:
    Value: !GetAtt RedisReplicationGroup.PrimaryEndPoint.Port
  RedisTlsEnabled:
    Value: !Ref RedisTransitEncryptionEnabled
  DatabaseHighCpuAlarmName:
    Value: !Ref DatabaseHighCpuAlarm
  DatabaseLowStorageAlarmName:
    Value: !Ref DatabaseLowStorageAlarm
  RedisHighCpuAlarmName:
    Value: !Ref RedisHighCpuAlarm
  RedisEvictionsAlarmName:
    Value: !Ref RedisEvictionsAlarm
