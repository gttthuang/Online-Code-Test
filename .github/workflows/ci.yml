name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: online_code_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d online_code_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: online_code_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Linux Rollup native package
        run: |
          ARCH="$(node -p "process.arch")"
          if [ "$ARCH" = "x64" ]; then
            npm install --no-save @rollup/rollup-linux-x64-gnu@4.60.1
          elif [ "$ARCH" = "arm64" ]; then
            npm install --no-save @rollup/rollup-linux-arm64-gnu@4.60.1
          else
            echo "Unsupported Rollup native architecture: $ARCH"
            exit 1
          fi

      - name: Run CI verification
        run: npm run ci:verify
